allowBuilds:
  '@carbon/grid': true
  '@carbon/layout': true
  '@pnpm/exe': true
  core-js: true
  esbuild: true
  unrs-resolver: true
# supply-chain hardening: skip versions published in the last day, and
# refuse packages whose provenance weakens between versions
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# older releases published by their maintainers before they adopted
# provenance attestations; exact versions so newer ones are still checked
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - reselect@5.1.1
  - semver@6.3.1
  - undici-types@6.21.0
overrides:
  "@undecaf/zbar-wasm": "^0.11.0"
  "@swc/helpers": "^0.5.23"
  "lodash-es": "^4.18.0"
  "js-cookie": "^3.0.7"
  "@babel/core": "^7.29.6"
  "browserslist": "^4.28.7"
  "@humanfs/node": "^0.16.8"
  "nanoid@<3.3.18": "3.3.18"
  "fast-uri@<3.1.6": "^3.1.6"
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=3.0.0 <5.0.9": "5.0.9"
patchedDependencies:
  "@undecaf/barcode-detector-polyfill@0.9.23": "patches/@undecaf__barcode-detector-polyfill@0.9.23.patch"
peerDependencyRules:
  allowedVersions:
    "typescript": "6"
    "eslint": "10"
